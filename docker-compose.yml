services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
  dashboard:
    build: .
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      PORT: 3000
    ports:
      - "3000:3000"
volumes:
  mosquitto-data:
  mosquitto-log:
